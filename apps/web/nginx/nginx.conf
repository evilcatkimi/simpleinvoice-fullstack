# Serves the SimpleInvoice SPA and reverse-proxies /api/* to the API service.
# Runs as an unprivileged user on a read-only root filesystem: everything nginx writes
# (pid file, request/proxy buffers) goes to the /tmp tmpfs.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # $request_id is also forwarded to the API, so one id links the nginx and API log lines.
  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time rid=$request_id "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Docker's embedded DNS, asked again every 10 s. A hostname written directly in proxy_pass is resolved once, at
  # startup: when the api container is recreated with a new address, nginx would keep proxying to the old one (502)
  # until it is restarted. `resolve` (open-source nginx >= 1.27.3) keeps re-resolving it while running; unlike a
  # variable in proxy_pass, it leaves the URI handling and $uri (used by the Cache-Control map) unchanged.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api_backend {
    zone api_backend 1m;
    server api:4000 resolve;
    # Reuse connections to the API (with proxy_http_version 1.1 and an empty Connection header, set in /api/). Idle ones
    # are dropped before Node's own 5 s keep-alive timeout, so nginx never picks a connection the API is closing (502).
    keepalive 16;
    keepalive_timeout 4s;
  }

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Build assets have content hashes in their names, so they can be cached forever. Everything
  # else (index.html, SPA routes, favicon) is revalidated so a new deploy shows up at once.
  # API responses keep the API's own caching headers: an empty value adds no header.
  map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
    default    "no-cache";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Headers are declared once, here. No location adds its own, so all of them inherit these
    # (nginx drops inherited add_header directives in any block that declares one itself).
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Swagger UI stays on the API's own port (127.0.0.1:4000 for the review); the public entry point does not re-expose
    # the API documentation, and with it the whole API surface, at /api/api/docs.
    location /api/api/ {
      return 404;
    }

    location /api/ {
      # The trailing slash strips the prefix: /api/invoices?page=2 -> http://api:4000/invoices?page=2
      proxy_pass http://api_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      # The API sends its own copies of these; hiding them keeps each header on the response once.
      proxy_hide_header Content-Security-Policy;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Permissions-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;

      # The largest legitimate request (create invoice) is a few KB.
      client_max_body_size 100k;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # A missing asset is a 404, not the SPA shell served as JavaScript.
    location /assets/ {
      try_files $uri =404;
    }

    # Client-side routes (/invoices/123, /login, …) all boot the SPA.
    location / {
      try_files $uri /index.html;
    }
  }
}
